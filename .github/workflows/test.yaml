name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make

      # The old gate was "! grep failure results.xml", which passes when
      # the file is missing, truncated, or carries <error> entries. The
      # script requires a nonempty well formed file, exactly the declared
      # test count from the @cocotb.test decorators, zero failures, zero
      # errors.
      - name: Gate on results.xml
        run: python3 scripts/check_results.py test/results.xml --expect-from-tests test/test.py

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*

  # Third audit, CI completeness. The white box suites ran only locally
  # before, a push could break them silently.
  tb_test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Datapath white box suite
        run: make -C tb TB=datapath

      - name: Gate on datapath results
        run: python3 scripts/check_results.py tb/results_datapath.xml --expect-from-tests tb/test_datapath.py

      - name: Top white box suite
        run: make -C tb TB=top

      - name: Gate on top results
        run: python3 scripts/check_results.py tb/results_top.xml --expect-from-tests tb/test_top.py

  # Third audit, CI completeness. The formal mutation gate with unbounded
  # induction on base, formal/mutation_test.sh owns pass or fail.
  formal:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-08-17'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mutation gate with induction
        run: bash formal/mutation_test.sh 60
